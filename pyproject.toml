[project]
name = "atlas-student"
version = "0.1.0"
description = "Local-first AI assistant for students"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
  "requests>=2.31,<3",
  "SpeechRecognition>=3.10,<4",
  "edge-tts>=6.1,<8",
  "pygame>=2.5,<3",
  "customtkinter>=5.2,<6",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
exclude = ["memory/archive.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
